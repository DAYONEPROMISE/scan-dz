name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # NOTE: no setup-android step: ubuntu-latest runners ship the SDK
      # (ANDROID_HOME pre-set); setup-android@v3 is broken (obsolete 'tools' pkg).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Assemble release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scandz-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scandz-release
          path: app/build/outputs/apk/release/*.apk
      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          {
            echo "# ScanDZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil pass (dark capture design verified, icons described)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md
      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: ScanDZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/app-debug.apk,app/build/outputs/apk/release/*.apk"
